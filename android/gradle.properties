org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# ponytail: Kotlin daemon가 프로젝트(D:)와 pub 캐시(C:)의 경로를 상대화하다 깨지는
# Windows 크로스 드라이브 버그 우회. 빌드가 조금 느려짐, 두 경로가 같은 드라이브면 제거 가능.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# ponytail: R8 full mode가 work-runtime:2.7.0(Room 2.2.5, reflection으로 _Impl 클래스를 찾음)의
# WorkDatabase 생성을 깨서 릴리스 빌드가 시작하자마자 크래시함(RuntimeException: Failed to
# create an instance of androidx.work.impl.WorkDatabase). work-runtime을 최신으로 올리면
# 근본 해결되지만 지금은 표준 우회로 막음 — 의존성 버전 올릴 때 이 줄 제거 검토.
android.enableR8.fullMode=false
